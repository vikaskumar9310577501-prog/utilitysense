<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTILITY SENSE - Energy & Utility Analytics</title>

  <!-- Apply saved theme immediately to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ep_theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- Local Offline Fonts & Material Symbols (Zero SSL Errors, Corporate Firewall & Offline Proof) -->
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    /* Fallback if Google CSS is delayed — prevents icon names flashing as clipped text */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif !important;
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
